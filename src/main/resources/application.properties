# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/rbpo
spring.datasource.username=rbpo_user
spring.datasource.password=qwerty

spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


# JWT
# Access token lifetime (15 minutes)
jwt.access.secret=MySuperSecretAccessKeyForJWTGenerationAndValidationAtLeast256Bits
jwt.access.expiration=900000
# Access token lifetime (7 days)
jwt.refresh.secret=MySuperSecretRefreshKeyDifferentFromAccessKeyForSecurity
jwt.refresh.expiration=604800000 


server.port=8085
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat